<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style_.css">
    <script src="./js/app.js" defer></script>
    <title>Quiz-App</title>
</head>
<body>
    <div class="main">
        <div class="box" id="box">
            <h2 id="quesBox">1) This is Dummy Question !</h2>

            <div class="row">
                <input type="radio" value="a" name="option" id="opt-a">
                <label for="opt-a" id="label-a">Option A</label>
            </div>

            <div class="row">
                <input type="radio" value="b" name="option" id="opt-b">
                <label for="opt-b" id="label-b">Option B</label>
            </div>

            <div class="row">
                <input type="radio" value="c" name="option" id="opt-c">
                <label for="opt-c" id="label-c">Option C</label>
            </div>

            <div class="row">
                <input type="radio" value="d" name="option" id="opt-d">
                <label for="opt-d" id="label-d">Option D</label>
            </div>

            <div class="row">
                <input type="radio" value="e" name="option" id="opt-e">
                <label for="opt-e">None of these</label>
            </div>

            <button class="btn" id="submitBtn">Submit</button>
        </div>
    </div>
</body>
</html>
